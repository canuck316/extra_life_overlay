<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>Extra Life Overlay</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
</head>
<body>
  <div id="overlay">

    <!-- Branding banner. Starts off-screen; the widget rotation slides it in
         while a widget is on screen and out again with it (features.md #1). -->
    <div id="banner-top">
      <img src="assets/ExtraLife-TopLine.png" alt="">
    </div>

    <!-- Persistent zone: fundraising totals -->
    <div id="zone-totals">
      <div class="totals-row">
        <span class="totals-label">Raised</span>
        <span class="totals-value" id="totals-participant">$0.00</span>
      </div>
      <div class="totals-bar">
        <div class="totals-bar-fill" id="totals-bar-fill"></div>
      </div>
      <div class="totals-goal" id="totals-goal">&nbsp;</div>
      <div class="totals-row totals-row-team">
        <span class="totals-label">Team</span>
        <span class="totals-value" id="totals-team">$0.00</span>
      </div>
    </div>

    <!-- Persistent zone: current / upcoming game (features.md #4).
         Contents swap between the two states; the zone itself never moves. -->
    <div id="zone-current-game">
      <div id="game-zone-inner"></div>
    </div>

    <!-- Widget slot (one visible at a time) -->
    <div id="widget-slot">
      <div id="widget-full-schedule" class="widget"></div>
      <div id="widget-dixper-skills" class="widget"></div>
    </div>

    <!-- Donation alert (features.md #3). The .webm is a 1920x1080 VP9 with an
         alpha channel; this box is sized from --alert-scale and centred, so one
         CSS value scales the whole alert. The text layer sits over the striped
         blue band across the middle of the artwork.

         widgets.js removes this element entirely when
         CONFIG.donationAlertEnabled is false. -->
    <div id="donation-alert">
      <video id="donation-alert-video"
             src="assets/DonoAlert-10s.webm"
             muted playsinline preload="auto"></video>
      <div id="donation-alert-text"></div>
    </div>

  </div>

  <script src="js/schedule.js"></script>
  <script src="js/donations.js"></script>
  <script src="js/dixper.js"></script>
  <script src="js/widgets.js"></script>
  <script src="js/twitch.js"></script>
  <script src="js/banner.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
